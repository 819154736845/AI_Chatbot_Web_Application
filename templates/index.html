<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nova AI Chatbot - Python Flask Internship Project">
  <title>Nova AI Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">✦</div>
        <div><h1>Nova AI</h1><p>Smart Chat Assistant</p></div>
      </div>
      <button id="clearBtn" class="clear-btn">Clear Chat</button>
    </header>

    <main class="chat-card">
      <section id="chatBox" class="chat-box" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🤖</div>
          <h2>How can I help you?</h2>
          <p>Ask me about Python, Flask, HTML, CSS, JavaScript or web development.</p>
          <div class="quick-actions">
            <button class="quick-btn" data-message="What is Python?">What is Python?</button>
            <button class="quick-btn" data-message="Explain Flask">Explain Flask</button>
            <button class="quick-btn" data-message="Tell me about web development">Web Development</button>
          </div>
        </div>
      </section>

      <form id="chatForm" class="input-area">
        <input id="messageInput" type="text" placeholder="Type your message..." autocomplete="off" maxlength="500" required>
        <button type="submit" class="send-btn">➤</button>
      </form>
      <p class="footer-note">Powered by Python + Flask • Internship Project Phase 1</p>
    </main>
  </div>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
